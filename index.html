<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Newsletter</title>
  </head>
  <body>
    <main class="body-container">
      <img class="logoImage" src="images/logo.svg" alt="logo" />
      <h1 class="heading">Join our newsletter</h1>
      
      <p class="subHeading">
        Keep up with our latest collections, exclusive deals, and special offers!<br />
        We introduce a new collection every week, so stay tuned to snag the <br/> hottest items just for you.
      </p>

      <div class="address-container">
        <input
          class="userInput"
          type="email"
          placeholder="Enter your email address"
          aria-label="Email address"
        />
        <button class="SaveButton" type="button">Subscribe now</button>
        <span class="notes">
          Your email is 100% confidential and won’t send you any spam.
        </span>
      </div>
    </main>
  </body>
</html>
